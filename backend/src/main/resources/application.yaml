spring:
  application:
    name: clothes-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/clothes
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: F7s9K2mQx8vRz4P1aT6yU0wL3bN5cD7e
  expiration: 86400000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

scheduler:
  soldout:
    interval-ms: 60000
